name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Check tag matches package version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${pkg}" >&2
            exit 1
          fi

      - name: Typecheck, test, build and package
        run: |
          npm run package
          mv dist/overstory.vsix "dist/overstory-${GITHUB_REF_NAME#v}.vsix"

      - name: Publish to the VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --packagePath dist/overstory-*.vsix

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/overstory-*.vsix
          generate_release_notes: true
